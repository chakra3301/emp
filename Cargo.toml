[workspace]
resolver = "3"
members = ["crates/*"]
# The Tauri shell builds on its own (npm run app); keeps `cargo test --workspace` light.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
emp-protocol = { path = "crates/emp-protocol" }
emp-core = { path = "crates/emp-core" }
emp-import = { path = "crates/emp-import" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
ulid = "1"
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"
dirs = "6"
walkdir = "2"
rand = "0.9"
hex = "0.4"
sha2 = "0.10"
tempfile = "3"
ts-rs = "12"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Keep debug artifacts small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
