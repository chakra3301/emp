[package]
name = "empd"
description = "EMP daemon: owns agents, terminals and the store; serves clients over a Unix socket and WebSocket."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
emp-protocol.workspace = true
emp-core.workspace = true
emp-import.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
rand.workspace = true
hex.workspace = true
ulid.workspace = true
portable-pty.workspace = true
base64.workspace = true
libc.workspace = true
sha2.workspace = true
chrono.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# WebSocket client for Codex's shared app-server (a Unix socket; `drivers/codex.rs`).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile.workspace = true
